name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libntl-dev pkg-config
      - name: Install oracle dependencies
        run: python3 -m pip install --user python-flint
      # The Lake target compiles clmul.c with `-O3` only, so an ordinary build
      # exercises the portable fallback and never the intrinsic. Compile the
      # self-test on both paths before anything else.
      - name: Cross-check every compiled clmul path (SPEC/hex-gf2.md)
        run: bash scripts/ci/check_clmul_paths.sh
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
      - name: Build library and release regressions
        run: lake build HexGF2
      - name: Build conformance sidecar
        run: |
          cd conformance
          lake build
      - name: Conformance oracle
        run: |
          (cd conformance && lake exe hexgf2_emit_fixtures) > /tmp/hex-gf2-fresh.jsonl
          diff -u conformance-fixtures/HexGF2/gf2.jsonl /tmp/hex-gf2-fresh.jsonl
          python3 scripts/oracle/gf2_flint.py < /tmp/hex-gf2-fresh.jsonl
      # `HexGF2/Bench.lean` resolves the informational NTL comparator by
      # running `scripts/oracle/setup_gf2_ntl_driver.sh` relative to its own
      # working directory. The bench sidecar runs from `bench/`, so build the
      # driver here from the repository root and pass its path explicitly.
      - name: Build the NTL bench comparator driver
        run: |
          echo "HEX_GF2_NTL_DRIVER=$(bash scripts/oracle/setup_gf2_ntl_driver.sh)" \
            >> "$GITHUB_ENV"
      - name: Build and verify benchmarks
        env:
          BENCH_VERIFY_HARD_CAP_SECONDS: "360"
        run: |
          cd bench
          lake build hexgf2_bench
          bash ../scripts/ci/check_bench_verify_budget.sh hexgf2_bench
      - name: Assert Mathlib-free
        run: |
          if find .lake bench/.lake conformance/.lake -type d -name Mathlib 2>/dev/null | grep -q .; then
            echo "ERROR: a Lake build pulled in Mathlib"; exit 1; fi
          if grep -rqE '^import Mathlib' HexGF2 conformance/HexGF2 bench/HexGF2 bench/HexGF2ReleasedBench.lean 2>/dev/null; then
            echo "ERROR: a source file imports Mathlib"; exit 1; fi
          echo "Mathlib-free OK"
