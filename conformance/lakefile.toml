name = "hex-gf2-conformance"
defaultTargets = ["HexGF2Conformance", "hexgf2_emit_fixtures"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexGF2"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "36e7d67fc3a511ca9d69f360def6e50769e439d4"

[[lean_lib]]
name = "HexGF2Conformance"
globs = ["HexGF2.Conformance", "HexGF2.CrossCheck", "HexGF2.FastCheck"]

[[lean_exe]]
name = "hexgf2_emit_fixtures"
root = "HexGF2.EmitFixtures"
