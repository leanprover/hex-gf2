name = "hex-gf2-bench"
defaultTargets = ["hexgf2_bench"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexGF2"
path = ".."

[[require]]
name = "lean-bench"
git = "https://github.com/kim-em/lean-bench.git"
rev = "master"

# `HexGF2/Bench.lean` is sync-managed and carries registrations only, so the
# executable roots at the unmanaged `HexGF2ReleasedBench.lean` wrapper beside
# it, which adds the `lean-bench` CLI entry point. The registrations are
# claimed by `lean_lib HexGF2BenchSupport` in the root lakefile, not here; see
# the comment there.
[[lean_exe]]
name = "hexgf2_bench"
root = "HexGF2ReleasedBench"
